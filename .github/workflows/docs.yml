# .github/workflows/docs.yml
name: Documentation

on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - run: pip install --upgrade pip
      - run: pip install -r docs/requirements.txt
      - run: cmake -B build/docs -S docs
      - name: Check links
        run: cmake --build build/docs --target linkcheck
        continue-on-error: true
      - name: Build HTML
        run: cmake --build build/docs --target html
      - run: touch build/docs/_build/html/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
